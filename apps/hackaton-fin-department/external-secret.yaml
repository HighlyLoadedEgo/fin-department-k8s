# Creds БД для приложения. Vault: secret/data/database/hackaton-fin {password}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hackaton-fin-db
  namespace: hackaton-fin
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: hackaton-fin-db
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        POSTGRES_USER: ${HACKATON_FIN_DB_USER}
        POSTGRES_PASSWORD: "{{ .password }}"
        POSTGRES_NAME: ${HACKATON_FIN_DB}
  data:
    - secretKey: password
      remoteRef:
        key: database/hackaton-fin
        property: password
---
# Pull-креды приватного Harbor для подов неймспейса. Vault: harbor/robot-ci
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: harbor-registry
  namespace: hackaton-fin
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: harbor-registry
    creationPolicy: Owner
    template:
      type: kubernetes.io/dockerconfigjson
      engineVersion: v2
      data:
        .dockerconfigjson: '{"auths":{"registry.mortypython.ru":{"username":"{{ .username }}","password":"{{ .password }}"}}}'
  data:
    - secretKey: username
      remoteRef:
        key: harbor/robot-ci
        property: username
    - secretKey: password
      remoteRef:
        key: harbor/robot-ci
        property: password
---
# Подключаем pull-секрет к default SA неймспейса.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: default
  namespace: hackaton-fin
imagePullSecrets:
  - name: harbor-registry
