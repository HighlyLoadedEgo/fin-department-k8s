# Creds БД для приложения. Vault: secret/data/database/hackaton-fin {password}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hackaton-fin-db
  namespace: hackaton-fin
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: hackaton-fin-db
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        POSTGRES_USER: ${HACKATON_FIN_DB_USER}
        POSTGRES_PASSWORD: "{{ .password }}"
        POSTGRES_NAME: ${HACKATON_FIN_DB}
  data:
    - secretKey: password
      remoteRef:
        key: database/hackaton-fin
        property: password
