# CD-контур: CI пушит в Harbor теги main-<UTC YYYYMMDDhhmmss>-<sha12>,
# ImagePolicy числит по ts, ImageUpdateAutomation коммитит новый тег в
# deployment.yaml (marker $imagepolicy ниже).
# Требует image-reflector/image-automation контроллеры (см. AGENTS.md).
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: hackaton-fin-department
  namespace: flux-system
spec:
  image: registry.mortypython.ru/fin/hackaton-fin-department
  interval: 2m
  exclusionList:
    - "^sha-.*"
  # Auth на приватный Harbor: ES ниже (Vault harbor/robot-ci).
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: hackaton-fin-department
  namespace: flux-system
spec:
  imageRepositoryRef:
    name: hackaton-fin-department
  filterTags:
    pattern: '^main-(?P<ts>[0-9]{14})-'
    extract: '$ts'
  policy:
    numerical:
      order: asc
---
# Robot account Harbor с правами pull проекта fin.
# Vault: secret/data/harbor/robot-ci {username, password}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: harbor-registry
  namespace: flux-system
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: harbor-registry
    creationPolicy: Owner
    template:
      type: kubernetes.io/dockerconfigjson
      engineVersion: v2
      data:
        .dockerconfigjson: '{"auths":{"registry.mortypython.ru":{"username":"{{ .username }}","password":"{{ .password }}"}}}'
  data:
    - secretKey: username
      remoteRef:
        key: harbor/robot-ci
        property: username
    - secretKey: password
      remoteRef:
        key: harbor/robot-ci
        property: password
