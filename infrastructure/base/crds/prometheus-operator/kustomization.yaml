---
# Prometheus Operator CRDs (PodMonitor, ServiceMonitor, Prometheus, ...).
# Версия = appVersion kube-prometheus-stack 87.21.0 → v0.92.1.
# Alertmanager CRD'ы (alertmanagers/alertmanagerconfigs) выброшены —
# Alertmanager выключен; их сухой dry-run вешал infrastructure-crds по таймауту.
# Применяются через infrastructure-crds ДО controllers.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - crds/crds.yaml
