---
# Creds для Barman → Yandex Cloud S3.
# Vault: secret/data/s3/yandex {accessKey, secretKey}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cnpg-backup-s3
  namespace: postgres
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: cnpg-backup-s3
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        ACCESS_KEY_ID: "{{ .accessKey }}"
        ACCESS_SECRET_KEY: "{{ .secretKey }}"
  data:
    - secretKey: accessKey
      remoteRef:
        key: s3/yandex
        property: accessKey
    - secretKey: secretKey
      remoteRef:
        key: s3/yandex
        property: secretKey
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: infra-db-daily
  namespace: postgres
spec:
  schedule: "0 30 2 * * *"
  backupOwnerReference: self
  immediate: true
  method: barmanObjectStore
  cluster:
    name: infra-db
