---
# infra-db — Postgres-кластер для инфра-сервисов (keycloak, harbor, ...).
# Каждый consumer получает свою роль (passwordSecret из Vault) и свою БД
# (Database CR с owner=role). Пароли — per-service в Vault database/<service>.
# Bootstrap-роль `app` остаётся vestigial: владеет init-БД, никто не ходит,
# пароль CNPG генерит сам (initdb.secret не задан).
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: infra-db
  namespace: postgres
spec:
  imageName: ghcr.io/cloudnative-pg/postgresql:18-bookworm
  # Single-node: instances=1 (локальный HA на одном узле + local-path бессмысленен).
  instances: 1
  primaryUpdateStrategy: unsupervised
  priorityClassName: fin-critical

  storage:
    size: 15Gi
    storageClass: ${LONGHORN_STORAGE_CLASS}

  backup:
    retentionPolicy: "8d"
    barmanObjectStore:
      # После migrate local-path→longhorn: новый empty prefix (старый
      # s3://…/infra-db занят WAL → recovery падал с Expected empty archive).
      destinationPath: s3://${CNPG_BACKUP_BUCKET}/infra-db
      endpointURL: ${S3_ENDPOINT_URL}
      # Yandex S3: path-style + регион идут через барман-окружение из s3Credentials-секрета не нужны — endpoint публичный TLS.
      s3Credentials:
        accessKeyId:
          name: cnpg-backup-s3
          key: ACCESS_KEY_ID
        secretAccessKey:
          name: cnpg-backup-s3
          key: ACCESS_SECRET_KEY
      wal:
        compression: gzip
      data:
        compression: gzip

  bootstrap:
    initdb:
      database: app
      owner: app
      postInitApplicationSQL:
        - "CREATE EXTENSION IF NOT EXISTS pg_trgm;"

  managed:
    roles:
      # Vestigial bootstrap-owner. Владеет init-БД `app` (пустая, никто не
      # подключается). createdb: false — БД создаются через Database CR.
      - name: app
        login: true
        superuser: false
        createdb: false
        createrole: false
      # Consumer: harbor. Vault database/harbor → Secret harbor-pg.
      - name: ${HARBOR_DB_USER}
        login: true
        superuser: false
        createdb: false
        createrole: false
        passwordSecret:
          name: harbor-pg
        inRoles:
          - pg_monitor
