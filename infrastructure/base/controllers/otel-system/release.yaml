# OpenTelemetry Operator: Instrumentation CR (auto-instrumentation) + OpenTelemetryCollector CR.
# CRD ставятся чартом (Helm install default = Create).
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: opentelemetry-operator
  namespace: opentelemetry-system
spec:
  interval: 1h
  timeout: 10m
  install:
    remediation:
      retries: -1
  upgrade:
    remediation:
      retries: -1
      remediateLastFailure: true
    cleanupOnFail: true
  chart:
    spec:
      chart: opentelemetry-operator
      version: "0.123.0"
      sourceRef:
        kind: HelmRepository
        name: open-telemetry
        namespace: flux-system
      interval: 15m
