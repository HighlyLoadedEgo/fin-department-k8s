# Дашборд «Игровая аналитика» v7: бизнес-метрики hackaton-fin-department (fin_*).
# Не больше двух панелей в ряду; донаты крупным планом с подписями на срезах;
# мягкая палитра (Nord); перевод через renameByRegex; агрегаты max by от дублей.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-game-analytics
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  game-analytics.json: |-
    {
      "annotations": {
        "list": []
      },
      "description": "Аналитика игры: главы, аудитория, активность, поведение, экономика миров.",
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 1,
      "id": null,
      "links": [],
      "refresh": "1m",
      "schemaVersion": 39,
      "tags": [
        "hackaton-fin-department",
        "game"
      ],
      "time": {
        "from": "now-24h",
        "to": "now"
      },
      "timezone": "browser",
      "title": "Игровая аналитика",
