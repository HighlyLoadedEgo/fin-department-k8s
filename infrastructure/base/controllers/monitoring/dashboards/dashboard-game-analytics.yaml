---
# Дашборд Game Analytics: бизнес-метрики hackaton-fin-department (префикс fin_).
# Игроки по главам, активность/евенты, экономика (балансы/бюджет), поведение, здоровье агрегатора.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-game-analytics
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  game-analytics.json: |-
    {
      "annotations": { "list": [] },
      "description": "Игровая аналитика hackaton-fin-department: главы, активность, экономика, поведение. Источник — бизнес-метрики fin_* c /metrics.",
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 1,
      "id": null,
      "links": [],
      "refresh": "1m",
      "schemaVersion": 39,
      "tags": ["hackaton-fin-department", "game"],
      "time": { "from": "now-24h", "to": "now" },
      "timezone": "browser",
      "title": "Game Analytics",
      "uid": "game-analytics",
      "version": 1,
      "templating": { "list": [] },
      "panels": [
        {
          "id": 1,
          "type": "row",
          "title": "Игроки",
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "prometheus" }
        },
        {
          "id": 2,
          "type": "stat",
          "title": "Миры (профили с сохранением)",
          "description": "Сохранённые облачные миры в snapshot_heads",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 4, "w": 4, "x": 0, "y": 1 },
          "targets": [{ "refId": "A", "expr": "fin_worlds_total" }],
          "options": {
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "auto",
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "textMode": "auto"
          },
          "fieldConfig": { "defaults": { "unit": "short" }, "overrides": [] }
        },
        {
          "id": 3,
          "type": "stat",
          "title": "Профили / прогоны",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 4, "w": 4, "x": 4, "y": 1 },
          "targets": [
            { "refId": "A", "expr": "fin_profiles_total" },
            { "refId": "B", "expr": "fin_game_runs_total" }
          ],
          "options": {
            "colorMode": "value",
            "graphMode": "none",
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "textMode": "auto"
          },
          "fieldConfig": { "defaults": { "unit": "short" }, "overrides": [] }
        },
        {
          "id": 4,
          "type": "bargauge",
          "title": "Игроки по главам (act)",
          "description": "Акт восстанавливается из state.story.currentDayId последнего снапшота",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 8, "w": 8, "x": 8, "y": 1 },
          "targets": [{
            "refId": "A",
            "expr": "fin_players_by_story_act",
            "legendFormat": "{{act}}"
          }],
          "options": {
            "displayMode": "gradient",
            "minVizHeight": 10,
            "minVizWidth": 0,
            "namePlacement": "auto",
            "orientation": "horizontal",
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "showUnfilled": true,
            "sizing": "auto",
            "valueMode": "color"
          },
          "fieldConfig": { "defaults": { "unit": "short" }, "overrides": [] }
        },
        {
          "id": 5,
          "type": "piechart",
          "title": "Темпераменты питомцев",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 8, "w": 8, "x": 16, "y": 1 },
          "targets": [{
            "refId": "A",
            "expr": "fin_players_by_pet_temperament",
            "legendFormat": "{{temperament}}"
          }],
          "options": {
            "legend": { "displayMode": "table", "placement": "right", "showLegend": true, "values": ["value"] },
            "pieType": "pie",
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "tooltip": { "mode": "single", "sort": "none" }
          },
          "fieldConfig": { "defaults": { "unit": "short" }, "overrides": [] }
        },
        {
          "id": 6,
          "type": "timeseries",
          "title": "Возраст питомца по мирам",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 6, "w": 8, "x": 0, "y": 5 },
          "targets": [{
            "refId": "A",
            "expr": "fin_players_by_pet_age",
            "legendFormat": "{{age}}"
          }],
          "options": {
            "legend": { "calcs": ["lastNotNull"], "displayMode": "table", "placement": "bottom", "showLegend": true },
            "tooltip": { "mode": "multi", "sort": "desc" }
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "custom": { "fillOpacity": 15, "lineWidth": 2, "showPoints": "never", "spanNulls": true }
            },
            "overrides": []
          }
        },
        {
          "id": 7,
          "type": "stat",
          "title": "Средний игровой день (прогресс)",
          "description": "Среднее state.engine.day по мирам",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 6, "w": 8, "x": 8, "y": 9 },
          "targets": [{
            "refId": "A",
            "expr": "fin_engine_day_sum / fin_engine_day_count"
          }],
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "textMode": "auto"
          },
          "fieldConfig": { "defaults": { "unit": "short", "decimals": 1 }, "overrides": [] }
        },
        {
          "id": 8,
          "type": "bargauge",
          "title": "Завершённые целевые проекты",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 6, "w": 8, "x": 16, "y": 9 },
          "targets": [{
            "refId": "A",
            "expr": "fin_goal_projects_completed",
            "legendFormat": "{{goal}}"
          }],
          "options": {
            "displayMode": "gradient",
            "orientation": "horizontal",
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "showUnfilled": true,
            "sizing": "auto",
            "valueMode": "color"
          },
          "fieldConfig": { "defaults": { "unit": "short" }, "overrides": [] }
        },
        {
          "id": 9,
          "type": "row",
          "title": "Активность и события",
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 15 },
          "datasource": { "type": "prometheus", "uid": "prometheus" }
        },
        {
          "id": 10,
          "type": "timeseries",
          "title": "Факты аналитики по типам (top 7)",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 16 },
          "targets": [{
            "refId": "A",
            "expr": "topk(7, sum by (detail_type) (rate(fin_analytics_facts_total[$__rate_interval])))",
            "legendFormat": "{{detail_type}}"
          }],
          "options": {
            "legend": { "calcs": ["rate", "max"], "displayMode": "table", "placement": "bottom", "showLegend": true },
            "tooltip": { "mode": "multi", "sort": "desc" }
          },
          "fieldConfig": {
            "defaults": {
              "unit": "ops",
              "custom": { "fillOpacity": 10, "lineWidth": 2, "showPoints": "never", "spanNulls": true }
            },
            "overrides": []
          }
        },
        {
          "id": 11,
          "type": "timeseries",
          "title": "Действия игроков (interaction, top 8)",
          "description": "Каждая команда движка пишет факт interaction с именем команды (клики, RenamePet, CompleteStoryGame, …)",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 16 },
          "targets": [{
            "refId": "A",
            "expr": "topk(8, sum by (name) (rate(fin_interactions_total[$__rate_interval])))",
            "legendFormat": "{{name}}"
          }],
          "options": {
            "legend": { "calcs": ["rate"], "displayMode": "table", "placement": "bottom", "showLegend": true },
            "tooltip": { "mode": "multi", "sort": "desc" }
          },
          "fieldConfig": {
            "defaults": {
              "unit": "ops",
              "custom": { "fillOpacity": 10, "lineWidth": 2, "showPoints": "never", "spanNulls": true }
            },
            "overrides": []
          }
        },
        {
          "id": 12,
          "type": "timeseries",
          "title": "Покупки против отказа",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 7, "w": 8, "x": 0, "y": 24 },
          "targets": [
            { "refId": "A", "expr": "sum by (purchased) (rate(fin_optional_purchases_total[$__rate_interval]))", "legendFormat": "куплено={{purchased}}" },
            { "refId": "B", "expr": "sum(rate(fin_desires_deferred_total[$__rate_interval]))", "legendFormat": "отложено желание" }
          ],
          "options": {
            "legend": { "calcs": ["rate"], "displayMode": "table", "placement": "bottom", "showLegend": true },
            "tooltip": { "mode": "multi", "sort": "desc" }
          },
          "fieldConfig": {
            "defaults": {
              "unit": "ops",
              "custom": { "fillOpacity": 10, "lineWidth": 2, "showPoints": "never", "spanNulls": true }
            },
            "overrides": []
          }
        },
        {
          "id": 13,
          "type": "timeseries",
          "title": "Накопления и запасы",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 7, "w": 8, "x": 8, "y": 24 },
          "targets": [
            { "refId": "A", "expr": "sum by (kind) (rate(fin_saving_amount_total[$__rate_interval]))", "legendFormat": "движение {{kind}}" },
            { "refId": "B", "expr": "sum(rate(fin_unexpected_expense_amount_total[$__rate_interval]))", "legendFormat": "незапланированная трата" },
            { "refId": "C", "expr": "sum(rate(fin_earning_amount_total[$__rate_interval]))", "legendFormat": "заработок" }
          ],
          "options": {
            "legend": { "calcs": ["rate"], "displayMode": "table", "placement": "bottom", "showLegend": true },
            "tooltip": { "mode": "multi", "sort": "desc" }
          },
          "fieldConfig": {
            "defaults": {
              "unit": "currencyUSD",
              "custom": { "fillOpacity": 10, "lineWidth": 2, "showPoints": "never", "spanNulls": true }
            },
            "overrides": []
          }
        },
        {
          "id": 14,
          "type": "stat",
          "title": "Правильность ответов",
          "description": "Доля practice_answer с selectedAnswerId == expectedAnswerId",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 7, "w": 8, "x": 16, "y": 24 },
          "targets": [{
            "refId": "A",
            "expr": "sum(rate(fin_practice_answers_total{correct=\"True\"}[$__rate_interval])) / clamp_min(sum(rate(fin_practice_answers_total[$__rate_interval])), 1e-9)"
          }],
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "textMode": "auto"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "min": 0,
              "max": 1,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "red", "value": null },
                  { "color": "yellow", "value": 0.5 },
                  { "color": "green", "value": 0.75 }
                ]
              }
            },
            "overrides": []
          }
        },
        {
          "id": 15,
          "type": "row",
          "title": "Экономика миров",
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 31 },
          "datasource": { "type": "prometheus", "uid": "prometheus" }
        },
        {
          "id": 16,
          "type": "timeseries",
          "title": "Средние балансы",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 32 },
          "targets": [
            { "refId": "A", "expr": "fin_pet_balance_sum / fin_pet_balance_count", "legendFormat": "доступный баланс" },
            { "refId": "B", "expr": "fin_pet_savings_balance_sum / fin_pet_savings_balance_count", "legendFormat": "накопления" },
            { "refId": "C", "expr": "fin_pet_unallocated_sum / fin_pet_unallocated_count", "legendFormat": "нераспределено" }
          ],
          "options": {
            "legend": { "calcs": ["lastNotNull", "mean"], "displayMode": "table", "placement": "bottom", "showLegend": true },
            "tooltip": { "mode": "multi", "sort": "desc" }
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "custom": { "fillOpacity": 10, "lineWidth": 2, "showPoints": "never", "spanNulls": true }
            },
            "overrides": []
          }
        },
        {
          "id": 17,
          "type": "timeseries",
          "title": "Средние доли плана бюджета",
          "description": "Доли needs/wants/savings/reserve в подтверждённых бюджетах",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 32 },
          "targets": [
            { "refId": "A", "expr": "sum(rate(fin_budget_amount_total{bucket=\"needs\"}[$__rate_interval])) / clamp_min(sum(rate(fin_budget_amount_total[$__rate_interval])), 1e-9)", "legendFormat": "needs" },
            { "refId": "B", "expr": "sum(rate(fin_budget_amount_total{bucket=\"wants\"}[$__rate_interval])) / clamp_min(sum(rate(fin_budget_amount_total[$__rate_interval])), 1e-9)", "legendFormat": "wants" },
            { "refId": "C", "expr": "sum(rate(fin_budget_amount_total{bucket=\"savings\"}[$__rate_interval])) / clamp_min(sum(rate(fin_budget_amount_total[$__rate_interval])), 1e-9)", "legendFormat": "savings" },
            { "refId": "D", "expr": "sum(rate(fin_budget_amount_total{bucket=\"reserve\"}[$__rate_interval])) / clamp_min(sum(rate(fin_budget_amount_total[$__rate_interval])), 1e-9)", "legendFormat": "reserve" }
          ],
          "options": {
            "legend": { "calcs": ["lastNotNull"], "displayMode": "table", "placement": "bottom", "showLegend": true },
            "tooltip": { "mode": "multi", "sort": "desc" }
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "min": 0,
              "custom": { "fillOpacity": 25, "lineWidth": 2, "showPoints": "never", "spanNulls": true, "stacking": { "group": "A", "mode": "normal" } }
            },
            "overrides": []
          }
        },
        {
          "id": 18,
          "type": "barchart",
          "title": "Распределение доступного баланса",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 40 },
          "targets": [{
            "refId": "A",
            "expr": "fin_pet_balance_bucket",
            "legendFormat": "≤ {{le}}",
            "instant": true,
            "format": "table"
          }],
          "options": {
            "legend": { "showLegend": false },
            "tooltip": { "mode": "single", "sort": "none" },
            "xField": "le",
            "barWidth": 0.7,
            "groupWidth": 0.7,
            "orientation": "auto",
            "showValue": "never",
            "stacking": "none"
          },
          "fieldConfig": {
            "defaults": { "unit": "short" },
            "overrides": [
              {
                "matcher": { "id": "byName", "options": "Time" },
                "properties": [{ "id": "custom.hidden", "value": true }]
              }
            ]
          }
        },
        {
          "id": 19,
          "type": "bargauge",
          "title": "Мини-игры и предметы (средние на мир)",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 40 },
          "targets": [
            { "refId": "A", "expr": "fin_completed_minigames_sum / fin_completed_minigames_count", "legendFormat": "мини-игр завершено" },
            { "refId": "B", "expr": "fin_owned_items_sum / fin_owned_items_count", "legendFormat": "предметов куплено" }
          ],
          "options": {
            "displayMode": "gradient",
            "orientation": "horizontal",
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "showUnfilled": true,
            "sizing": "auto",
            "valueMode": "color"
          },
          "fieldConfig": { "defaults": { "unit": "short", "decimals": 2 }, "overrides": [] }
        },
        {
          "id": 20,
          "type": "row",
          "title": "Награды и синхронизация",
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 48 },
          "datasource": { "type": "prometheus", "uid": "prometheus" }
        },
        {
          "id": 21,
          "type": "timeseries",
          "title": "Награды родителей",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 7, "w": 8, "x": 0, "y": 49 },
          "targets": [
            { "refId": "A", "expr": "sum by (reward_type) (rate(fin_rewards_issued_total{created=\"True\"}[$__rate_interval]))", "legendFormat": "выдано {{reward_type}}" },
            { "refId": "B", "expr": "sum by (outcome) (rate(fin_reward_receipts_acknowledged_total[$__rate_interval]))", "legendFormat": "подтверждено {{outcome}}" }
          ],
          "options": {
            "legend": { "calcs": ["rate"], "displayMode": "table", "placement": "bottom", "showLegend": true },
            "tooltip": { "mode": "multi", "sort": "desc" }
          },
          "fieldConfig": {
            "defaults": {
              "unit": "ops",
              "custom": { "fillOpacity": 10, "lineWidth": 2, "showPoints": "never", "spanNulls": true }
            },
            "overrides": []
          }
        },
        {
          "id": 22,
          "type": "timeseries",
          "title": "Загрузки снапшотов и аналитики",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 7, "w": 8, "x": 8, "y": 49 },
          "targets": [
            { "refId": "A", "expr": "sum by (created) (rate(fin_snapshot_uploads_total[$__rate_interval]))", "legendFormat": "снапшоты created={{created}}" },
            { "refId": "B", "expr": "sum by (created) (rate(fin_analytics_batches_total[$__rate_interval]))", "legendFormat": "батчи аналитики created={{created}}" },
            { "refId": "C", "expr": "sum by (created) (rate(fin_profile_registrations_total[$__rate_interval]))", "legendFormat": "регистрации created={{created}}" }
          ],
          "options": {
            "legend": { "calcs": ["rate"], "displayMode": "table", "placement": "bottom", "showLegend": true },
            "tooltip": { "mode": "multi", "sort": "desc" }
          },
          "fieldConfig": {
            "defaults": {
              "unit": "ops",
              "custom": { "fillOpacity": 10, "lineWidth": 2, "showPoints": "never", "spanNulls": true }
            },
            "overrides": []
          }
        },
        {
          "id": 23,
          "type": "stat",
          "title": "Свежесть агрегации",
          "description": "Время с последнего успешного пересчёта миров",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 7, "w": 8, "x": 16, "y": 49 },
          "targets": [
            { "refId": "A", "expr": "time() - fin_aggregation_last_success_unixtime" },
            { "refId": "B", "expr": "increase(fin_aggregation_errors_total[1h])" }
          ],
          "options": {
            "colorMode": "background_solid",
            "graphMode": "none",
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "textMode": "auto"
          },
          "fieldConfig": {
            "defaults": {
              "decimals": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "yellow", "value": 300 },
                  { "color": "red", "value": 900 }
                ]
              }
            },
            "overrides": [
              {
                "matcher": { "id": "byName", "options": "B" },
                "properties": [
                  { "id": "unit", "value": "short" },
                  { "id": "thresholds", "value": { "mode": "absolute", "steps": [{ "color": "green", "value": null }, { "color": "red", "value": 1 }] } },
                  { "id": "displayName", "value": "ошибки за час" }
                ]
              },
              {
                "matcher": { "id": "byName", "options": "A" },
                "properties": [
                  { "id": "unit", "value": "s" },
                  { "id": "displayName", "value": "назад" }
                ]
              }
            ]
          }
        }
      ]
    }
