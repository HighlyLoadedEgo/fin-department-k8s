            },
            {
              "id": "renameByRegex",
              "options": {
                "regex": "act-2",
                "renamePattern": "Глава 2"
              }
            },
            {
              "id": "renameByRegex",
              "options": {
                "regex": "act-3",
                "renamePattern": "Глава 3"
              }
            },
            {
              "id": "renameByRegex",
              "options": {
