---
# Продуктовый обзор: поведение в игре; все запросы опираются на существующие fin_* метрики.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-children-play
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  children-play.json: |-
    {
      "id": null,
      "uid": "children-play",
      "title": "Как играют дети",
      "description": "Продуктовая аналитика финансовой игры: решения, трудности по навыкам и прогресс синхронизированных миров. Без подмены событий числом детей.",
