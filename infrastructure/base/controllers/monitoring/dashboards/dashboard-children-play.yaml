          "type": "row",
          "description": "",
          "gridPos": {
            "x": 0,
            "y": 17,
            "w": 24,
            "h": 1
          },
          "collapsed": false,
          "panels": []
        },
        {
          "id": 7,
          "title": "Доля эпизодов с трудностями",
          "type": "bargauge",
          "description": "DIFFICULTY / (SUPPORTED + DIFFICULTY + NEUTRAL) по навыку. Сравнивайте с размером выборки ниже. Это наблюдения в игре, не диагноз и не доля детей.",
          "gridPos": {
            "x": 0,
            "y": 18,
            "w": 12,
            "h": 11
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
