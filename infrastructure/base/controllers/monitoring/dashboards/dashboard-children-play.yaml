            "content": "**Область данных:** только синхронизированные миры и последние принятые проекции. Offline-игра появится после синхронизации.\n\n**Доли — про события и эпизоды.** Они не показывают процент детей, освоивших навык. Малая выборка требует осторожности; «нет наблюдений» не равно нулю.\n\n**Период сверху** меняет историю графиков и блок новых событий. Остальные панели показывают текущие агрегаты, а не когорту выбранного периода. История Prometheus хранится 3 дня."
