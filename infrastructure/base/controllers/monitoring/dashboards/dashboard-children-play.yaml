                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "text": {
              "titleSize": 14,
              "valueSize": 36
            }
          }
        },
        {
          "id": 4,
          "title": "Ответы в практиках",
          "type": "stat",
          "description": "Размер выборки для доли правильных ответов; сохранённые факты, а не ответы за выбранный период.",
          "gridPos": {
            "x": 12,
            "y": 5,
            "w": 6,
            "h": 4
