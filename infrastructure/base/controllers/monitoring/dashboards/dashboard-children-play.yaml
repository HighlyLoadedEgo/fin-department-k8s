              "expr": "(sort_desc(max by (skill) (fin_skill_episodes_avg{namespace=\"hackaton-fin\",counter=\"difficulty_episodes\"}) / ((max by (skill) (fin_skill_episodes_avg{namespace=\"hackaton-fin\",counter=\"supported_episodes\"}) + max by (skill) (fin_skill_episodes_avg{namespace=\"hackaton-fin\",counter=\"difficulty_episodes\"}) + max by (skill) (fin_skill_episodes_avg{namespace=\"hackaton-fin\",counter=\"neutral_episodes\"})) > 0))) and on() (max(fin_skill_assessed_worlds_total{namespace=\"hackaton-fin\"}) > 0)",
              "refId": "A",
              "instant": true,
              "range": false,
              "legendFormat": "{{skill}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "decimals": 1,
              "min": 0,
              "noValue": "Нет наблюдений",
