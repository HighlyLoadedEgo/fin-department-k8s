      "schemaVersion": 39,
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 1,
      "refresh": "1m",
      "tags": [
        "game",
        "product-analytics",
        "hackaton-fin-department"
      ],
      "timezone": "browser",
      "time": {
        "from": "now-24h",
        "to": "now"
      },
      "timepicker": {
        "refresh_intervals": [
          "1m",
          "5m",
          "15m"
        ]
      },
      "annotations": {
        "list": []
      },
      "templating": {
        "list": []
      },
      "links": [
        {
          "title": "Экономика, предметы и синхронизация",
          "type": "link",
          "url": "/d/game-analytics",
          "keepTime": true,
          "includeVars": false,
          "targetBlank": false
        }
      ],
      "panels": [
        {
          "id": 1,
          "title": "Как играют дети",
          "type": "text",
          "description": "",
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 24,
            "h": 5
          },
          "options": {
            "mode": "markdown",
            "content": "Текущие синхронизированные данные. Рост аудитории — на графике ниже; экономика, предметы и синхронизация — по ссылке сверху."
          }
        },
        {
          "id": 2,
          "title": "Профили устройств",
          "type": "stat",
          "description": "Зарегистрированные профили устройств. Не уникальные дети. Динамика — на графике ниже.",
          "gridPos": {
            "x": 0,
            "y": 5,
            "w": 6,
            "h": 4
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "expr": "max(fin_profiles_total{namespace=\"hackaton-fin\"})",
              "refId": "A",
              "instant": true,
              "range": false
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "decimals": 0,
              "min": 0,
              "noValue": "Нет наблюдений",
              "color": {
                "mode": "fixed",
                "fixedColor": "#5794F2"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "#5794F2",
                    "value": null
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "auto",
            "orientation": "auto",
            "textMode": "auto",
            "wideLayout": true,
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "text": {
              "titleSize": 14,
              "valueSize": 36
            }
          }
        },
        {
          "id": 3,
          "title": "Миры с сохранением",
          "type": "stat",
          "description": "Распознанные сохранённые миры. Это текущий запас сохранений, не активные дети.",
          "gridPos": {
            "x": 6,
            "y": 5,
            "w": 6,
            "h": 4
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "expr": "max(fin_worlds_total{namespace=\"hackaton-fin\"})",
              "refId": "A",
              "instant": true,
              "range": false
