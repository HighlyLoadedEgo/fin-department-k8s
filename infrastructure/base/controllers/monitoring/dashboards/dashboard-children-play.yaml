          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "decimals": 0,
              "min": 0,
              "noValue": "Нет наблюдений",
              "color": {
                "mode": "fixed",
                "fixedColor": "#5794F2"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "#5794F2",
                    "value": null
                  }
                ]
              }
            },
            "overrides": []
          },
