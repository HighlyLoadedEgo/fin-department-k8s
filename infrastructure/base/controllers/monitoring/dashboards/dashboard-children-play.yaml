        {
          "id": 1,
          "title": "Как играют дети",
          "type": "text",
          "description": "",
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 24,
            "h": 5
          },
          "options": {
            "mode": "markdown",
            "content": "Сводка — синхронизированная история. Новые события — внизу, за выбранный период."
          }
        },
