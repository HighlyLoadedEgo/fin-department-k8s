              "refId": "A",
              "instant": true,
              "range": false
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "decimals": 1,
              "min": 0,
              "noValue": "Нет наблюдений",
              "color": {
                "mode": "fixed",
                "fixedColor": "#73BFBA"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "#73BFBA",
                    "value": null
                  }
                ]
              },
              "max": 1
            },
            "overrides": []
          },
          "options": {
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "auto",
            "orientation": "auto",
            "textMode": "auto",
            "wideLayout": true,
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "text": {
              "titleSize": 14,
              "valueSize": 36
            }
          }
        },
        {
          "id": 28,
          "title": "Как растёт аудитория",
          "type": "timeseries",
          "description": "История количества профилей устройств, сохранённых миров и прогонов. Линии могут уменьшаться при удалении/замене данных. Это не DAU. Retention Prometheus — 3 дня; новых данных до начала сбора нет.",
          "gridPos": {
            "x": 0,
            "y": 9,
            "w": 24,
            "h": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "max(fin_profiles_total{namespace=\"hackaton-fin\"})",
              "legendFormat": "Профили устройств",
              "instant": false,
              "range": true
            },
            {
              "refId": "B",
              "expr": "max(fin_worlds_total{namespace=\"hackaton-fin\"})",
              "legendFormat": "Сохранённые миры",
              "instant": false,
              "range": true
            },
            {
              "refId": "C",
              "expr": "max(fin_game_runs_total{namespace=\"hackaton-fin\"})",
              "legendFormat": "Игровые прогоны",
              "instant": false,
              "range": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "decimals": 0,
              "min": 0,
              "noValue": "Нет наблюдений",
              "color": {
                "mode": "palette-classic"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "#5794F2",
                    "value": null
                  }
                ]
              },
              "custom": {
                "drawStyle": "line",
                "lineInterpolation": "stepAfter",
                "lineWidth": 2,
                "fillOpacity": 0,
                "showPoints": "never",
                "spanNulls": false,
                "axisLabel": "Количество",
                "stacking": {
                  "mode": "none",
                  "group": "A"
                }
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "calcs": [],
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "transformations": []
        },
        {
