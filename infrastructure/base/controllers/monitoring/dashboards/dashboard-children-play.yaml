            "defaults": {
              "unit": "none",
              "decimals": 0,
              "min": 0,
              "noValue": "Нет наблюдений",
              "color": {
                "mode": "fixed",
                "fixedColor": "#B4A0E5"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "#B4A0E5",
                    "value": null
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "auto",
            "orientation": "auto",
            "textMode": "auto",
            "wideLayout": true,
            "reduceOptions": {
