          "description": "Число распознанных сохранённых миров. Не DAU и не уникальные дети.",
          "gridPos": {
            "x": 0,
            "y": 5,
            "w": 6,
            "h": 5
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "expr": "max(fin_worlds_total{namespace=\"hackaton-fin\"})",
              "refId": "A",
              "instant": true,
              "range": false
