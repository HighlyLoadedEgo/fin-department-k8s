                },
                "overrides": []
              },
              "options": {
                "showHeader": true,
                "cellHeight": "sm",
                "footer": {
                  "show": false
                },
                "enablePagination": true
              }
            },
            {
              "id": 130,
              "title": "Навыки: исходные оценки",
              "type": "table",
              "gridPos": {
                "x": 0,
                "y": 67,
                "w": 24,
                "h": 10
              },
              "description": "Серверные оценки skill_assessments. Каждая версия политики показана отдельно; без оценки — пустая таблица.",
              "datasource": {
                "type": "postgres",
                "uid": "fin-postgres"
              },
              "targets": [
                {
                  "refId": "A",
                  "format": "table",
                  "rawQuery": true,
                  "editorMode": "code",
                  "rawSql": "SELECT s.game_run_id AS \"Прогон\", s.policy_version AS \"Версия оценки\",\n  s.based_on_history_sequence AS \"Оценка по событие\",\n  skill->>'skillId' AS \"Навык\", skill->>'status' AS \"Статус\",\n  skill #>> '{observationCounts,completedEpisodes}' AS \"Завершено\",\n  skill #>> '{observationCounts,supportedEpisodes}' AS \"Успешно\",\n  skill #>> '{observationCounts,difficultyEpisodes}' AS \"Затруднения\",\n  skill #>> '{observationCounts,pendingEpisodes}' AS \"В процессе\",\n  skill #>> '{observationCounts,incompleteEpisodes}' AS \"Мало свидетельств\",\n  skill->>'assessmentReason' AS \"Основание\",\n  skill->>'explanation' AS \"Объяснение\",\n  skill->>'observationCounts' AS \"Все счётчики\"\nFROM profiles p\nJOIN snapshot_heads h USING (profile_id)\nJOIN skill_assessments s ON s.profile_id = p.profile_id AND s.game_run_id = h.game_run_id\nCROSS JOIN LATERAL jsonb_array_elements(\n  CASE WHEN jsonb_typeof(s.skills) = 'array' THEN s.skills ELSE '[]'::jsonb END\n) AS skill\nWHERE p.device_id = ${device_id:sqlstring}\nORDER BY s.policy_version, skill->>'skillId'"
                }
              ],
              "fieldConfig": {
                "defaults": {
                  "custom": {
                    "align": "auto",
                    "cellOptions": {
                      "type": "auto"
                    },
                    "filterable": true
                  },
                  "noValue": "—"
                },
                "overrides": []
              },
              "options": {
                "showHeader": true,
                "cellHeight": "sm",
                "footer": {
                  "show": false
                },
                "enablePagination": true
              }
            },
            {
              "id": 140,
              "title": "События: исходные данные",
              "type": "table",
              "gridPos": {
                "x": 0,
                "y": 77,
                "w": 24,
                "h": 10
              },
              "description": "До 500 событий из последней сохранённой проекции. Начало/конец окна показывают покрытие: это может быть часть истории. При одинаковой последовательности выбирается последняя ревизия; старые проекции не суммируются.",
              "datasource": {
                "type": "postgres",
                "uid": "fin-postgres"
              },
              "targets": [
                {
                  "refId": "A",
                  "format": "table",
                  "rawQuery": true,
                  "editorMode": "code",
                  "rawSql": "WITH latest AS (\n  SELECT a.* FROM profiles p\n  JOIN snapshot_heads h USING (profile_id)\n  JOIN analytics_projections a ON a.profile_id = p.profile_id AND a.game_run_id = h.game_run_id\n  WHERE p.device_id = ${device_id:sqlstring}\n  ORDER BY a.through_history_sequence DESC, a.revision DESC,\n    a.history_start_sequence DESC, a.projection_version DESC, a.evaluator_version DESC\n  LIMIT 1\n)\nSELECT event->>'eventId' AS \"Событие\", (event->>'sequence')::bigint AS \"Порядок\",\n  event->>'episodeId' AS \"Эпизод\", event->>'actionId' AS \"Действие\",\n  event #>> '{detail,_type}' AS \"Тип\", event->>'detail' AS \"Данные\",\n  latest.game_run_id AS \"Прогон\", latest.history_start_sequence AS \"Начало окна\",\n  latest.through_history_sequence AS \"Конец окна\",\n  latest.projection_version AS \"Версия проекции\"\nFROM latest\nCROSS JOIN LATERAL jsonb_array_elements(\n  CASE WHEN jsonb_typeof(latest.facts) = 'array' THEN latest.facts ELSE '[]'::jsonb END\n) AS event\nORDER BY (event->>'sequence')::bigint DESC, event->>'eventId'\nLIMIT 500"
                }
              ],
              "fieldConfig": {
                "defaults": {
                  "custom": {
                    "align": "auto",
                    "cellOptions": {
                      "type": "auto"
                    },
                    "filterable": true
                  },
                  "noValue": "—"
                },
                "overrides": []
              },
              "options": {
                "showHeader": true,
                "cellHeight": "sm",
                "footer": {
                  "show": false
                },
                "enablePagination": true
              }
            },
