        {
          "id": 40,
          "title": "Последние действия в игре",
          "type": "table",
          "gridPos": {
            "x": 0,
            "y": 34,
            "w": 14,
            "h": 12
          },
          "description": "До 500 событий последнего полученного окна текущей игры. Это может быть часть истории. «Шаг» — порядок в игре, а не дата. Полные данные и границы окна — в техническом блоке.",
          "datasource": {
            "type": "postgres",
            "uid": "fin-postgres"
          },
          "targets": [
            {
              "refId": "A",
              "format": "table",
              "rawQuery": true,
              "editorMode": "code",
              "rawSql": "SELECT event.*,\n  CASE event.\"Тип\"\n    WHEN 'interaction' THEN coalesce(detail->>'name', 'Игровое действие')\n    WHEN 'practice_answer' THEN concat_ws(' · ', 'Вопрос: ' || (detail->>'questionId'), 'Ответ: ' || (detail->>'selectedAnswerId'))\n    WHEN 'budget_confirmed' THEN concat_ws(' · ', 'Нужды: ' || (detail->>'needs'), 'Желания: ' || (detail->>'wants'), 'Накопления: ' || (detail->>'savings'), 'Резерв: ' || (detail->>'reserve'))\n    WHEN 'optional_purchase' THEN concat_ws(' · ', 'Предмет: ' || (detail->>'itemId'), 'Цена: ' || (detail->>'price'))\n    ELSE coalesce('Сумма: ' || (detail->>'amount'), detail->>'name', 'Подробности в технических данных')\n  END AS \"Что произошло\"\nFROM (\nWITH latest AS (\n  SELECT a.* FROM profiles p\n  JOIN snapshot_heads h USING (profile_id)\n  JOIN analytics_projections a ON a.profile_id = p.profile_id AND a.game_run_id = h.game_run_id\n  WHERE p.device_id = ${device_id:sqlstring}\n  ORDER BY a.through_history_sequence DESC, a.revision DESC,\n    a.history_start_sequence DESC, a.projection_version DESC, a.evaluator_version DESC\n  LIMIT 1\n)\nSELECT event->>'eventId' AS \"Событие\", (event->>'sequence')::bigint AS \"Порядок\",\n  event->>'episodeId' AS \"Эпизод\", event->>'actionId' AS \"Действие\",\n  event #>> '{detail,_type}' AS \"Тип\", event->>'detail' AS \"Данные\",\n  latest.game_run_id AS \"Прогон\", latest.history_start_sequence AS \"Начало окна\",\n  latest.through_history_sequence AS \"Конец окна\",\n  latest.projection_version AS \"Версия проекции\"\nFROM latest\nCROSS JOIN LATERAL jsonb_array_elements(\n  CASE WHEN jsonb_typeof(latest.facts) = 'array' THEN latest.facts ELSE '[]'::jsonb END\n) AS event\nORDER BY (event->>'sequence')::bigint DESC, event->>'eventId'\nLIMIT 500\n) event\nCROSS JOIN LATERAL (SELECT event.\"Данные\"::jsonb AS detail) payload\nORDER BY event.\"Порядок\" DESC, event.\"Событие\""
            }
          ],
          "fieldConfig": {
            "defaults": {
              "custom": {
                "align": "left",
                "cellOptions": {
                  "type": "auto"
                },
                "filterable": true,
                "minWidth": 90
              },
              "noValue": "—",
              "unit": "none"
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "Действие"
                },
                "properties": [
