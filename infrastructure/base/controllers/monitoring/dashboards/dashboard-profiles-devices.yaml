          "targets": [
            {
              "refId": "A",
              "format": "table",
              "rawQuery": true,
              "editorMode": "code",
              "rawSql": "SELECT \"Питомец\" FROM (\nWITH world AS (\n  SELECT p.*, h.game_run_id, h.server_revision,\n    CASE WHEN pg_input_is_valid(NULLIF(h.snapshot_json, ''), 'jsonb')\n         THEN h.snapshot_json::jsonb ELSE '{}'::jsonb END AS doc\n  FROM profiles p LEFT JOIN snapshot_heads h USING (profile_id)\n)\nSELECT device_id, profile_id::text AS profile_id,\n  pet_json->>'name' AS \"Питомец\", pet_json->>'age' AS \"Возраст питомца\",\n  pet_json->>'color' AS \"Цвет\", pet_json->>'temperament' AS \"Характер\",\n  pet_json->>'selectedLookId' AS \"Облик\",\n  game_run_id AS \"Текущий прогон\", server_revision AS \"Ревизия\",\n  doc #>> '{state,story,currentDayId}' AS \"Сюжетный день\",\n  doc #>> '{state,engine,day}' AS \"Игровой день\",\n  CASE WHEN jsonb_typeof(doc #> '{state,economy,availableBalance}') = 'number'\n    THEN (doc #>> '{state,economy,availableBalance}')::numeric END AS \"Баланс\",\n  CASE WHEN jsonb_typeof(doc #> '{state,economy,savingsBalance}') = 'number'\n    THEN (doc #>> '{state,economy,savingsBalance}')::numeric END AS \"Накопления\",\n  CASE WHEN jsonb_typeof(doc #> '{state,economy,unallocated}') = 'number'\n    THEN (doc #>> '{state,economy,unallocated}')::numeric END AS \"Не распределено\",\n  doc #>> '{state,economy,plan}' AS \"Бюджетный план\",\n  CASE WHEN jsonb_typeof(doc #> '{state,ownedItems}') = 'array'\n    THEN jsonb_array_length(doc #> '{state,ownedItems}') END AS \"Предметы\",\n  CASE WHEN jsonb_typeof(doc #> '{state,completedMiniGames}') = 'array'\n    THEN jsonb_array_length(doc #> '{state,completedMiniGames}') END AS \"Завершённые мини-игры\",\n  doc #>> '{state,completedGoalProjects}' AS \"Завершённые цели\"\nFROM world\nWHERE device_id = ${device_id:sqlstring}\n) selected_profile"
            }
          ],
