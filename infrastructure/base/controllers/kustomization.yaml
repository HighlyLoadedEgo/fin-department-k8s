apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  # storage / network base
  - priority-classes
  - longhorn
  - metallb-system
  - metallb-system/custom-resources
  - istio-system
  # pki / secrets
  - cert-manager
  - external-secrets
  # vault
  - vault-system
  # data
  - cnpg-system
  - postgres-system
  # registry
  - harbor-system
  # observability
  - monitoring
  - jaeger
  - otel-system
  # ui
  - headlamp
  # weave-gitops выключен: v0.38 (последняя, проект закрыт) ходит по
  # v1beta2-версиям Flux CRD, которые больше не обслуживаются → пустой UI.
  # UI кластера — Headlamp (вход по SA-token). Вернуть при даунгрейде CRD.
  # - weave-gitops
