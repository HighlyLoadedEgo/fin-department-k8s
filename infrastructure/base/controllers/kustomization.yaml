apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  # storage / network base
  - priority-classes
  - longhorn
  # metallb выключен: VPS в облаке — L2 ARP-анонсы режутся виртуализацией.
  # VIP = IP ноды, ingressgateway ловит трафик через spec.externalIPs
  # (прописан в istio-system/ingressgateway.yaml). На bare-metal вернуть:
  # раскомментировать + закрепить DNS на VIP.
  # - metallb-system
  # - metallb-system/custom-resources
  - istio-system
  # pki / secrets
  - cert-manager
  - external-secrets
  # vault
  - vault-system
  # data
  - cnpg-system
  - postgres-system
  # registry
  - harbor-system
  # observability
#  - monitoring
#  - loki
#  - jaeger
#  - otel-system
  # ui
#  - headlamp
#  - weave-gitops
