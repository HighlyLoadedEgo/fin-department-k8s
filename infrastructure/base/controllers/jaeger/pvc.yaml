# Badger storage Jaeger (traces). Longhorn — можно расширять on-line.
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: jaeger-badger
  namespace: jaeger
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
  storageClassName: ${LONGHORN_STORAGE_CLASS}
