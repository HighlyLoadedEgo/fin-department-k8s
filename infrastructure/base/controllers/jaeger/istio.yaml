# Jaeger UI на публичном поддомене (DNS A → VIP; SAN в fin-tls).
---
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: jaeger
  namespace: jaeger
spec:
  hosts:
    - "${JAEGER_HOST}"
  gateways:
    - istio-system/fin-gw
  http:
    - name: primary
      match:
        - uri:
            prefix: /
      route:
        - destination:
            host: jaeger-query.jaeger.svc.cluster.local
            port:
              number: 16686
      timeout: 3600s
