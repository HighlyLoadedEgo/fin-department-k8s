# Jaeger v2 (all-in-one) с badger-хранилищем на PVC. Приём OTLP :4317/:4318,
# UI :16686, zipkin-приём :9411 (Istio шлёт трейсы сюда — см. istiod.yaml).
# Приложения шлют трейсы на jaeger-collector.jaeger.svc.cluster.local:4317.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: jaeger
  namespace: jaeger
spec:
  interval: 1h
  timeout: 10m
  install:
    remediation:
      retries: -1
  upgrade:
    remediation:
      retries: -1
      remediateLastFailure: true
    cleanupOnFail: true
  chart:
    spec:
      chart: jaeger
      version: "4.13.1"
      sourceRef:
        kind: HelmRepository
        name: jaegertracing
        namespace: flux-system
      interval: 15m
  values:
    fullnameOverride: jaeger
    jaeger:
      replicas: 1
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          memory: 512Mi
      extraVolumes:
        - name: badger-data
          persistentVolumeClaim:
            claimName: jaeger-badger
      extraVolumeMounts:
        - name: badger-data
          mountPath: /badger
      # Jaeger v2 config (OTel-collector based). Хранение — badger на PVC.
      userconfig:
        extensions:
          healthcheckv2:
            use_v2: true
            http:
              endpoint: 0.0.0.0:13133
          jaeger_storage:
            backends:
              badger_store:
                badger:
                  directory: /badger/data
                  directory_key: /badger/key
                  ephemeral: false
                  span_store_ttl: 168h
        service:
          extensions: [jaeger_storage, healthcheckv2]
          pipelines:
            traces:
              receivers: [otlp]
              exporters: [jaeger_storage_exporter]
        receivers:
          otlp:
            protocols:
              grpc:
                endpoint: 0.0.0.0:4317
              http:
                endpoint: 0.0.0.0:4318
        exporters:
          jaeger_storage_exporter:
            trace_storage: badger_store
