# Vault: secret/data/database/harbor {password}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: harbor-db-auth
  namespace: harbor
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: harbor-db-auth
    creationPolicy: Owner
  data:
    - secretKey: password
      remoteRef:
        key: database/harbor
        property: password
---
# Vault: secret/data/harbor/admin {admin-password}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: harbor-admin
  namespace: harbor
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: harbor-admin
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        HARBOR_ADMIN_PASSWORD: "{{ .adminPassword }}"
  data:
    - secretKey: adminPassword
      remoteRef:
        key: harbor/admin
        property: admin-password
---
# Vault: secret/data/harbor/secret-key {secretKey} — ровно 16 символов
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: harbor-secret-key
  namespace: harbor
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: harbor-secret-key
    creationPolicy: Owner
  data:
    - secretKey: secretKey
      remoteRef:
        key: harbor/secret-key
        property: secretKey
---
# S3-creds registry → Yandex Object Storage. Vault: secret/data/s3/yandex
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: harbor-s3
  namespace: harbor
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: harbor-s3
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        REGISTRY_STORAGE_S3_ACCESSKEY: "{{ .accessKey }}"
        REGISTRY_STORAGE_S3_SECRETKEY: "{{ .secretKey }}"
  data:
    - secretKey: accessKey
      remoteRef:
        key: s3/yandex
        property: accessKey
    - secretKey: secretKey
      remoteRef:
        key: s3/yandex
        property: secretKey
