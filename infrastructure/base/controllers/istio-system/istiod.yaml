---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: istiod
  namespace: istio-system
spec:
  maxHistory: 2
  dependsOn:
    - name: istio-base
      namespace: istio-system
  interval: 30m
  timeout: 10m
  targetNamespace: istio-system
  install:
    remediation:
      retries: -1
  upgrade:
    remediation:
      retries: -1
      remediateLastFailure: true
    cleanupOnFail: true
    force: true
  releaseName: istiod
  chart:
    spec:
      chart: istiod
      version: "1.30.3"
      interval: 15m
      sourceRef:
        kind: HelmRepository
        name: istio
        namespace: flux-system
  values:
    pilot:
      autoscaleEnabled: true
      autoscaleMin: 1
      autoscaleMax: 3
      replicaCount: 1
      resources:
        requests:
          cpu: 500m
          memory: 1Gi
        limits:
          cpu: "1"
          memory: 2Gi
      traceSampling: 5.0
    global:
      istioNamespace: istio-system
      logAsJson: true
      logging:
        level: "default:info"
      telemetry:
        enabled: true
        v2:
          metadataExchange:
            wasmEnabled: false
        prometheus:
          enabled: true
          wasmEnabled: false
      proxy:
        logLevel: info
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
    meshConfig:
      enablePrometheusMerge: true
      enableTracing: true
      accessLogFile: /dev/stdout
      accessLogEncoding: TEXT
      defaultProviders:
        metrics: ["prometheus"]
        tracing: ["jaeger"]
      extensionProviders:
        # Трейсы → Jaeger (OTLP/zipkin-порт collector'а).
        - name: jaeger
          zipkin:
            service: jaeger-collector.jaeger.svc.cluster.local
            port: 9411
