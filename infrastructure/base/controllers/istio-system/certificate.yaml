# Публичные хосты (mortypython.ru): LE HTTP-01 через ingressgateway.
# DNS A-записи → VIP должны существовать до reconcile, иначе Certificate не Ready.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: fin-tls
  namespace: istio-system
spec:
  secretName: fin-tls
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  # Без wildcard: LE запрещает mixing wildcard+exact, а wildcard требует
  # DNS-01 (у нас HTTP-01). Новые поддомены добавлять сюда явным SAN'ом.
  dnsNames:
    - "${DOMAIN}"
    - "${HARBOR_HOST}"
    - "${GRAFANA_HOST}"
    - "${HEADLAMP_HOST}"
    - "${WEAVE_HOST}"
    - "${JAEGER_HOST}"
