---
apiVersion: v1
kind: Namespace
metadata:
  name: istio-system
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: istio-base
  namespace: istio-system
spec:
  interval: 30m
  timeout: 10m
  targetNamespace: istio-system
  install:
    crds: Skip
    remediation:
      retries: -1
  upgrade:
    crds: Skip
    remediation:
      retries: -1
      remediateLastFailure: true
    cleanupOnFail: true
    force: true
  releaseName: istio-base
  chart:
    spec:
      chart: base
      version: "1.30.3"
      interval: 15m
      sourceRef:
        kind: HelmRepository
        name: istio
        namespace: flux-system
