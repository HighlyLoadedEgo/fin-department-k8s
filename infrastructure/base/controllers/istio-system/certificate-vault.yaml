# Vault — внутренний хост (vault.mortypython.local, /etc/hosts → VIP).
# LE невозможен → CA-issuer (корень fin-department Root CA, импортируй в браузер).
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: vault-tls
  namespace: istio-system
spec:
  secretName: vault-tls
  issuerRef:
    name: ca-issuer
    kind: ClusterIssuer
  duration: 8760h
  dnsNames:
    - "${VAULT_HOST}"
