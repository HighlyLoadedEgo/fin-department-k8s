---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cert-manager
  namespace: cert-manager
spec:
  interval: 1m
  timeout: 15m
  install:
    crds: Skip
    remediation:
      retries: -1
      remediateLastFailure: true
  upgrade:
    crds: Skip
    remediation:
      retries: -1
      remediateLastFailure: true
  chart:
    spec:
      chart: cert-manager
      version: "v1.21.0"
      sourceRef:
        kind: HelmRepository
        name: jetstack
        namespace: flux-system
      interval: 1m
  values:
    installCRDs: false
    replicaCount: 1
    config:
      enableGatewayAPI: true
