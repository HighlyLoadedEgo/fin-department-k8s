---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: headlamp
  namespace: headlamp
spec:
  interval: 1h
  timeout: 10m
  install:
    remediation:
      retries: -1
  upgrade:
    remediation:
      retries: -1
      remediateLastFailure: true
    cleanupOnFail: true
  chart:
    spec:
      chart: headlamp
      version: "0.43.0"
      sourceRef:
        kind: HelmRepository
        name: headlamp
        namespace: flux-system
      interval: 15m
  values:
    fullnameOverride: headlamp
    config:
      pluginsDir: /build/plugins
      inCluster: true
      unsafeUseServiceAccountToken: false
      # Без OIDC (Keycloak нет): вход service account token'ом.
      # Токен: kubectl -n headlamp create token headlamp
      oidc:
        secret:
          create: false
        externalSecret:
          enabled: false
    # Flux UI: copy the pinned plugin into ephemeral storage on each pod start.
    initContainers:
      - name: headlamp-plugin-flux
        image: ghcr.io/headlamp-k8s/headlamp-plugin-flux:v0.7.0
        imagePullPolicy: IfNotPresent
        command:
          - /bin/sh
          - -c
          - cp -r /plugins/* /build/plugins/ && chown -R 100:101 /build/plugins
        securityContext:
          runAsNonRoot: false
          runAsUser: 0
          runAsGroup: 0
          privileged: false
          allowPrivilegeEscalation: false
        volumeMounts:
          - name: headlamp-plugins
            mountPath: /build/plugins
    volumeMounts:
      - name: headlamp-plugins
        mountPath: /build/plugins
        readOnly: true
    volumes:
      - name: headlamp-plugins
        emptyDir: {}
    # Chart-managed binding kept off: roleRef is immutable; we bind SA in rbac.yaml.
    clusterRoleBinding:
      create: false
      clusterRoleName: oidc-cluster-readonly
    service:
      type: ClusterIP
      port: 80
    ingress:
      enabled: false
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        memory: 512Mi
