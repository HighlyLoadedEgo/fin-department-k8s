---
# OIDC groups (Keycloak → apiserver oidc-groups-prefix=oidc:).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cluster-admins
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  - kind: Group
    name: oidc:cluster-admins
    apiGroup: rbac.authorization.k8s.io
---
# Stock "view" is too narrow for Headlamp (no cluster-scoped / many CRDs).
# Keep this allowlist explicit: Kubernetes RBAC has no deny rule, so a wildcard
# over the core API would expose Secret values to cluster-viewers.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: oidc-cluster-readonly
rules:
  - apiGroups: [""]
    resources:
      - componentstatuses
      - configmaps
      - endpoints
      - events
      - limitranges
      - namespaces
      - nodes
      - persistentvolumeclaims
      - persistentvolumes
      - pods
      - pods/log
      - podtemplates
      - replicationcontrollers
      - resourcequotas
      - serviceaccounts
      - services
    verbs: ["get", "list", "watch"]
  - apiGroups:
      - apiextensions.k8s.io
      - apiregistration.k8s.io
      - apps
      - autoscaling
      - batch
      - cert-manager.io
      - discovery.k8s.io
      - external-secrets.io
      - gateway.networking.k8s.io
      - helm.toolkit.fluxcd.io
      - image.toolkit.fluxcd.io
      - kustomize.toolkit.fluxcd.io
      - networking.istio.io
      - networking.k8s.io
      - notification.toolkit.fluxcd.io
      - policy
      - postgresql.cnpg.io
      - rbac.authorization.k8s.io
      - rabbitmq.com
      - source.toolkit.fluxcd.io
      - storage.k8s.io
      - tekton.dev
      - triggers.tekton.dev
    resources: ["*"]
    verbs: ["get", "list", "watch"]
  - nonResourceURLs: ["*"]
    verbs: ["get"]
---
# New name: roleRef is immutable; renaming lets Flux create + prune old binding.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: oidc-cluster-viewers
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: oidc-cluster-readonly
subjects:
  - kind: Group
    name: oidc:cluster-viewers
    apiGroup: rbac.authorization.k8s.io
---
# Headlamp in-cluster SA must NOT be cluster-admin (would bypass OIDC user RBAC).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: headlamp-sa-readonly
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: oidc-cluster-readonly
subjects:
  - kind: ServiceAccount
    name: headlamp
    namespace: headlamp
