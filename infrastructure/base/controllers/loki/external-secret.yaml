# Loki пишет в Yandex Cloud S3. Vault: secret/data/s3/yandex.
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: loki-s3
  namespace: loki
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: loki-s3
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        AWS_ACCESS_KEY_ID: "{{ .accessKey }}"
        AWS_SECRET_ACCESS_KEY: "{{ .secretKey }}"
  data:
    - secretKey: accessKey
      remoteRef:
        key: s3/yandex
        property: accessKey
    - secretKey: secretKey
      remoteRef:
        key: s3/yandex
        property: secretKey
