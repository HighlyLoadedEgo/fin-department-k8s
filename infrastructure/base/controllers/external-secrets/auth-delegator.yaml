# С disable_local_ca_jwt=true reviewer'ом при TokenReview выступает сам JWT
# ESO. Без system:auth-delegator TokenReview запрещён → login в Vault падает
# голым "permission denied".
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: external-secrets-auth-delegator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:auth-delegator
subjects:
  - kind: ServiceAccount
    name: external-secrets
    namespace: external-secrets
