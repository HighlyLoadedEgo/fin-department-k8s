---
apiVersion: v1
kind: Service
metadata:
  name: minio
  namespace: minio
  labels:
    app: minio
    app.kubernetes.io/name: minio
spec:
  type: ClusterIP
  ports:
    # Istio protocol selection is by Service port name. `api`/`console` → TCP,
    # Envoy hangs browser POST/OPTIONS to s3.tmst.io / console-s3.tmst.io.
    - name: http-api
      port: 9000
      targetPort: api
      protocol: TCP
    - name: http-console
      port: 9001
      targetPort: console
      protocol: TCP
  selector:
    app: minio
    app.kubernetes.io/name: minio
