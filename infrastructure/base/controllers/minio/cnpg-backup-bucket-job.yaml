---
# Создаёт бакет для CNPG Barman backups (как harbor-minio-bucket).
apiVersion: batch/v1
kind: Job
metadata:
  name: cnpg-backup-minio-bucket
  namespace: minio
  annotations:
    kustomize.toolkit.fluxcd.io/force: enabled
spec:
  ttlSecondsAfterFinished: 86400
  backoffLimit: 6
  template:
    spec:
      restartPolicy: OnFailure
      priorityClassName: fin-platform
      containers:
        - name: mc
          image: minio/mc:RELEASE.2025-04-16T18-13-26Z
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: minio-root
                  key: rootUser
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: minio-root
                  key: rootPassword
            - name: BUCKET
              value: ${CNPG_BACKUP_BUCKET}
          command:
            - /bin/sh
            - -ec
            - |
              until mc alias set local http://minio.minio.svc.cluster.local:9000 "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD"; do
                echo "waiting for minio..."
                sleep 3
              done
              mc mb --ignore-existing "local/$${BUCKET}"
              mc ls "local/$${BUCKET}"
              echo "bucket $${BUCKET} ready"
