# Админ-пароль Weave UI (без Keycloak). Chart с adminUser.create: false
# читает секрет weave-gitops-admin-auth {username, password}.
# Vault: secret/data/weave-gitops/admin
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: weave-gitops-admin-auth
  namespace: weave
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: weave-gitops-admin-auth
    creationPolicy: Owner
  data:
    - secretKey: username
      remoteRef:
        key: weave-gitops/admin
        property: username
    - secretKey: password
      remoteRef:
        key: weave-gitops/admin
        property: password
