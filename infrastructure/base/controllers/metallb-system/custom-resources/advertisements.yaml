---
# L2-режим (ARP/NDP): адреса пула «анонсируются» с node, где запущен speaker.
# Подходит для bare-metal / on-prem кластеров без внешнего LB-контроллера.
apiVersion: metallb.io/v1beta1
kind: L2Advertisement
metadata:
  name: fin-advertisement
  namespace: metallb-system
spec:
  ipAddressPools:
    - fin-ip-pool
