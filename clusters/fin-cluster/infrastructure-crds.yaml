apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infrastructure-crds
  namespace: flux-system
spec:
  interval: 1h
  retryInterval: 1m
  timeout: 15m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./infrastructure/base/crds
  prune: true
  wait: true
  # Dry-run drift detection на больших CRD (alertmanager/prometheus) ловит
  # таймауты apiserver'а. CRD меняются только вместе с чартами — дрейф не нужен.
  driftDetection:
    mode: disabled
