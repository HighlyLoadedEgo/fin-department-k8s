# Кластерные переменные fin-cluster. ${VAR} подставляется Flux postBuild.
apiVersion: v1
kind: ConfigMap
metadata:
  name: cluster-settings
  namespace: flux-system
data:
  CLUSTER_NAME: fin-cluster
  NODE_IP: 77.91.112.72
  METALLB_IP_POOL: 77.91.112.72-77.91.112.72
  DOMAIN: mortypython.ru
  # VIP = публичный IP ноды (облако): MetalLB не работает (L2 ARP режется),
  # ingressgateway ловит трафик через spec.externalIPs.

  # Harbor — публичный.
  REGISTRY: registry.mortypython.ru
  REGISTRY_NAMESPACE: fin
  HARBOR_HOST: registry.mortypython.ru

  # UI-хосты (публичные, HTTP-01): добавь DNS A → 77.91.112.72.
  GRAFANA_HOST: grafana.mortypython.ru
  HEADLAMP_HOST: headlamp.mortypython.ru
  WEAVE_HOST: weave.mortypython.ru
  JAEGER_HOST: jaeger.mortypython.ru

  # Vault — внутренний хост: /etc/hosts на клиенте → 77.91.112.72.
  # Серт self-signed CA (ClusterIssuer ca-issuer).
  VAULT_HOST: vault.mortypython.local
  VAULT_ADDR: https://vault.mortypython.local

  STORAGE_CLASS: local-path
  LONGHORN_STORAGE_CLASS: longhorn

  # Yandex Cloud S3 (Object Storage). Бакеты создаются руками в консоли:
  # harbor, loki-logs, cnpg-backups. Ключи: Vault secret/s3/yandex.
  S3_ENDPOINT_URL: https://storage.yandexcloud.net
  S3_REGION: ru-central1

  HARBOR_DB_USER: harbor
  HARBOR_DB: harbor
  HARBOR_S3_BUCKET: harbor-mortypython
  CNPG_BACKUP_BUCKET: mortypython-cnpg-backups
  LOKI_S3_BUCKET: mortypython-loki-logs
