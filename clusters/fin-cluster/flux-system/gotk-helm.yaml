# Hand-written KS: HelmRepository'ы из ./helm. gotk-components.yaml и
# gotk-sync.yaml в этой папке генерирует `flux bootstrap` — не править руками.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: flux-helm
  namespace: flux-system
spec:
  interval: 30m
  retryInterval: 1m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./helm
  prune: true
  wait: true
